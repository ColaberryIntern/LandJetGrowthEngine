<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Percy Kapadia | LinkedIn (mock)</title>
<style>
  body { font-family: -apple-system, system-ui, Arial, sans-serif; margin: 0; background: #f3f2ef; }
  .topbar { background: #fff; padding: 12px; border-bottom: 1px solid #ddd; font-weight: 700; }
  .profile { max-width: 800px; margin: 24px auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .name { font-size: 24px; font-weight: 700; }
  .headline { color: #444; margin-top: 6px; }
  .actions { margin-top: 20px; }
  button { font: inherit; padding: 8px 16px; border-radius: 20px; border: 1px solid #0a66c2; background: #0a66c2; color: #fff; cursor: pointer; font-weight: 600; }
  button.outline { background: #fff; color: #0a66c2; }
  /* Mock the LinkedIn modal pattern -- role="dialog" + textarea[name="message"] */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); align-items: center; justify-content: center; z-index: 100; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #fff; padding: 28px; border-radius: 12px; min-width: 480px; max-width: 600px; }
  .modal h2 { margin: 0 0 8px 0; font-size: 20px; }
  .modal p { color: #666; font-size: 14px; }
  .modal .note-area { display: none; margin-top: 16px; }
  .modal.note-shown .note-area { display: block; }
  .modal textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; box-sizing: border-box; min-height: 80px; resize: vertical; }
  .modal-actions { margin-top: 18px; display: flex; gap: 8px; justify-content: flex-end; }
  /* Aside: a persistent messaging widget at the bottom (real LinkedIn has one). Tests v1.0.19/20 false-match cases. */
  .messaging-widget { position: fixed; bottom: 0; right: 20px; width: 320px; height: 60px; background: #fff; border: 1px solid #ddd; border-radius: 8px 8px 0 0; padding: 12px; box-shadow: 0 -2px 8px rgba(0,0,0,.1); }
  .messaging-widget textarea { width: 100%; border: 0; outline: 0; font: inherit; resize: none; }
</style>
</head>
<body>
<div class="topbar">LinkedIn (mock for Playwright tests)</div>

<main>
<div class="profile">
  <div class="name">Percy Kapadia</div>
  <div class="headline">VP of Operations, Mock Company</div>
  <div class="actions">
    <button id="connect-btn" aria-label="Invite Percy Kapadia to connect">Connect</button>
    <button class="outline">Message</button>
    <button class="outline" aria-label="More actions">More</button>
  </div>
</div>
</main>

<!-- Mock LinkedIn's connect dialog. Hidden until Connect is clicked. -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal" role="dialog" aria-labelledby="add-a-note">
    <h2 id="add-a-note">Add a note to your invitation?</h2>
    <p>Personalized invitations are 30% more likely to be accepted. Add a note.</p>
    <button id="add-note-btn">Add a note</button>
    <div class="note-area">
      <textarea name="message" id="custom-message" maxlength="300" placeholder="Type your message..."></textarea>
      <div class="modal-actions">
        <button class="outline" id="cancel-btn">Cancel</button>
        <button id="send-btn" aria-label="Send invitation">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- Persistent messaging widget (mimics LinkedIn's bottom-right chat). v1.0.19/20 used to mistakenly match this. -->
<div class="messaging-widget">
  <textarea placeholder="Search messages..."></textarea>
</div>

<script>
  const backdrop = document.getElementById('modal-backdrop');
  const modal = document.getElementById('modal');
  document.getElementById('connect-btn').addEventListener('click', () => {
    backdrop.classList.add('open');
  });
  document.getElementById('add-note-btn').addEventListener('click', () => {
    modal.classList.add('note-shown');
    setTimeout(() => document.getElementById('custom-message').focus(), 50);
  });
  document.getElementById('cancel-btn').addEventListener('click', () => {
    backdrop.classList.remove('open');
    modal.classList.remove('note-shown');
  });
  document.getElementById('send-btn').addEventListener('click', () => {
    document.body.setAttribute('data-send-fired', 'yes');
    backdrop.classList.remove('open');
  });
  // Expose internal state for tests to assert against
  window.__mockLinkedIn = {
    getNoteValue: () => document.getElementById('custom-message').value,
    isModalOpen: () => backdrop.classList.contains('open'),
    isNoteShown: () => modal.classList.contains('note-shown'),
    didSendFire: () => document.body.getAttribute('data-send-fired') === 'yes',
  };
</script>
</body>
</html>
