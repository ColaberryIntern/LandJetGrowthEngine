# growth.landjet.com -> landjet-frontend (4000) + landjet-backend (3011)
#
# Installed at /etc/nginx/sites-available/growth-landjet on the production VPS
# (95.216.199.47) and symlinked into sites-enabled/. Reload with:
#     sudo nginx -t && sudo systemctl reload nginx
#
# Set up 2026-05-18 after Percy added the DNS A record growth.landjet.com -> 95.216.199.47.
#
# HTTP-only for now. Port 443 on the host is bound by the op-nginx Docker
# container (Opportunity Pulse), so HTTPS for this vhost is a follow-up:
#   - Option A: spin up a dedicated landjet-nginx container with its own cert
#   - Option B: front the site with Cloudflare (free, adds external dependency)
#   - Option C: move 443 termination to host nginx (risky -- breaks op-nginx)

server {
    listen 80;
    server_name growth.landjet.com;

    # Increase max body size for any future file uploads (CSV imports etc.)
    client_max_body_size 25M;

    # Proxy /api/* directly to the backend container, bypassing the Next.js
    # rewrite layer (saves a hop).
    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else -> Next.js frontend container
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
